name: Oli Daily Verify

on:
  workflow_dispatch:
  schedule:
    - cron: '17 12 * * *'
  pull_request:
    paths:
      - 'commander/**'
      - 'lib/oli/**'
      - 'app/api/oli/**'
      - 'app/oli/**'
      - 'components/oli/**'
      - 'scripts/oli-verify.mjs'
      - '.github/workflows/oli-daily-verify.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify Oli registry and runtime contract
        run: node scripts/oli-verify.mjs

# Scheduled workflows execute from the repository default branch.
# This workflow becomes the repository-level daily verifier after this branch is merged.
# Cross-repository and Vercel discovery updates remain a connector-authorized Commander task;
# no provider, GitHub, or Vercel master credential is embedded here.
